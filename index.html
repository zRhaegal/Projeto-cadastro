<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Devs</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <header>
            <h1>Cadastro de DEVs</h1>
            <p>Complete suas informações</p>
        </header>

        <form id="devForm">
            <div class="row">
                <div class="field">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" autocomplete="given-name" required>
                </div>

                <div class="field">
                    <label for="sobrenome">Sobrenome</label>
                    <input type="text" id="sobrenome" name="sobrenome" autocomplete="family-name" required>
                </div>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <fieldset>
                <legend>De qual lado da aplicação você desenvolve?</legend>

                <label class="option">
                    <input type="radio" name="lado" value="frontend">
                    Front-end
                </label>

                <label class="option">
                    <input type="radio" name="lado" value="backend">
                    Back-end
                </label>

                <label class="option">
                    <input type="radio" name="lado" value="fullstack">
                    Fullstack
                </label>
            </fieldset>

            <div class="field select-field">
                <label for="senioridade">Senioridade</label>
                <select id="senioridade" name="senioridade" required>
                    <option value="" selected disabled>Selecione</option>
                    <option value="junior">Júnior</option>
                    <option value="pleno">Pleno</option>
                    <option value="senior">Sênior</option>
                </select>
            </div>

            <fieldset class="technologies">
                <legend>Selecione as tecnologias que utiliza:</legend>

                <div class="checkboxes">
                    <label><input type="checkbox" name="tecnologias" value="html"> HTML</label>
                    <label><input type="checkbox" name="tecnologias" value="css"> CSS</label>
                    <label><input type="checkbox" name="tecnologias" value="javascript"> JavaScript</label>
                    <label><input type="checkbox" name="tecnologias" value="php"> PHP</label>
                    <label><input type="checkbox" name="tecnologias" value="csharp"> C#</label>
                    <label><input type="checkbox" name="tecnologias" value="python"> Python</label>
                    <label><input type="checkbox" name="tecnologias" value="java"> Java</label>
                </div>
            </fieldset>

            <div class="field">
                <label for="experiencia">conte um pouco mais de sua experiencia:</label>
                <textarea name="experiencia" id="experiencia" rows="8">

            </textarea>

            </div>

            <button type="submit">concluido</button>
            <p id="mensagem" class="mensagem" aria-live="polite">
            <p>
                </div>
        </form>
    </main>
    <script src="script.js"></script>
</body>

</html>
